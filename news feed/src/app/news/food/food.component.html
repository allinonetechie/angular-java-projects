<div *ngIf ="results">
<div class="container-fluid">
    <div class="col-md-12 input-group text-center" style ="padding: 0px;">
        <div class="col-md-8 input-group-addon " style ="padding: 0px;">
            <ngb-pagination [collectionSize]="results.length" #numPages [pageSize]="itemsPerPage" [(page)]="currentPage" (pageChange)="onPageChange(currentPage)"></ngb-pagination>
        </div>
        <!-- <div class="col-1 input-group-addon">
            <input class="input-sm" style="float: right;" type="number" [min]="10" [max]="results.length" step="1" [(ngModel)]="itemsPerPage" (onClick)="changePagesize(pageSize)">
        </div>  -->
    </div>

    <div class="row">
        <ng-container *ngFor="let result of results | slice: pageSize | slice: 0:itemsPerPage" >
            <div class="col-md-4 grid-margin text-center row-eq-height" >
                <div class="card">
                    <img *ngIf="result.multimedia != null" src="{{result.multimedia[2].url}}" width="100%" height="300px" alt="OmegaXone"/>
                        <img *ngIf="result.multimedia == null" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/No_image_available.svg/768px-No_image_available.svg.png" class="center" alt="OmegaXone"/>
                            <div class="card-body" >
                                <h4 style="font-weight: 600;">{{result.title}}</h4>
                                <p style="font-weight: 100;">{{result.abstract}}</p>
                                <p style="font-weight: 300;">The New York Times <span *ngIf="result.byline != ''">| {{result.byline}} </span></p>
                                <a href={{result.url}} target="_blank"><button type="button" class="btn btn-gradient-dark btn-fw">Read More</button></a>
                            </div> 
                </div>   
            </div>
        </ng-container>
    </div> 


    <!-- <ul *ngIf="results">
        <li *ngFor="let user of results | slice: pageSize | slice: 0:itemsPerPage">
            
            <p>{{ user.title }}</p>
        </li>
    </ul> -->
    <div class="col-md-8 input-group-addon " style="padding: 0px;">
        <ngb-pagination [collectionSize]="results.length" #numPages [pageSize]="itemsPerPage" [(page)]="currentPage" (pageChange)="onPageChange(currentPage)"></ngb-pagination>
    </div>
    <pre><span class="float-md-left">Page: {{ currentPage }} / {{numPages.pageCount}}</span><span class="float-md-right">Found items: {{ itemsPerPage }} / {{ results.length }}</span></pre>
</div>
</div>
